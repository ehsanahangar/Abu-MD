{% extends "base.html" %}

{% block title %}ایجاد فاکتور جدید{% endblock %}

{% block content %}
<div class="container">
    <h1>ایجاد فاکتور جدید</h1>
    <form action="{{ url_for('create_invoice') }}" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="customer" class="form-label">مشتری</label>
                <select class="form-select" id="customer" name="customer_id" required>
                    <option selected disabled value="">یک مشتری را انتخاب کنید...</option>
                    {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label for="issue_date" class="form-label">تاریخ صدور</label>
                <input type="date" class="form-control" id="issue_date" name="issue_date" required>
            </div>
            <div class="col-md-3 mb-3">
                <label for="due_date" class="form-label">تاریخ سررسید</label>
                <input type="date" class="form-control" id="due_date" name="due_date">
            </div>
        </div>

        <hr>

        <h2>آیتم‌های فاکتور</h2>
        <div id="invoice-items">
            <!-- Invoice items will be added here dynamically -->
        </div>

        <button type="button" class="btn btn-secondary mt-2" id="add-item-btn">اضافه کردن آیتم</button>

        <hr>

        <button type="submit" class="btn btn-primary">ایجاد فاکتور</button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const addItemBtn = document.getElementById('add-item-btn');
    const invoiceItemsContainer = document.getElementById('invoice-items');
    let itemIndex = 0;

    addItemBtn.addEventListener('click', function() {
        const itemHtml = `
            <div class="row invoice-item" id="item-row-${itemIndex}">
                <div class="col-md-5 mb-2">
                    <label for="product-${itemIndex}" class="form-label">محصول/خدمت</label>
                    <select class="form-select" id="product-${itemIndex}" name="items[${itemIndex}][product_id]" required>
                        <option selected disabled value="">یک محصول را انتخاب کنید...</option>
                        {% for product in products %}
                        <option value="{{ product.id }}">{{ product.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-2">
                    <label for="quantity-${itemIndex}" class="form-label">تعداد</label>
                    <input type="number" class="form-control" id="quantity-${itemIndex}" name="items[${itemIndex}][quantity]" min="1" value="1" required>
                </div>
                <div class="col-md-3 mb-2">
                    <label for="price-${itemIndex}" class="form-label">قیمت واحد</label>
                    <input type="number" step="0.01" class="form-control" id="price-${itemIndex}" name="items[${itemIndex}][unit_price]" required>
                </div>
                <div class="col-md-1 mb-2 d-flex align-items-end">
                    <button type="button" class="btn btn-danger remove-item-btn" data-index="${itemIndex}">حذف</button>
                </div>
            </div>
        `;
        invoiceItemsContainer.insertAdjacentHTML('beforeend', itemHtml);
        itemIndex++;
    });

    invoiceItemsContainer.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('remove-item-btn')) {
            const index = e.target.getAttribute('data-index');
            document.getElementById(`item-row-${index}`).remove();
        }
    });

    // Automatically add the first item
    addItemBtn.click();
});
</script>
{% endblock %}
