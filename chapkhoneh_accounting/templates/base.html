<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}نرم‌افزار حسابداری چاپخانه{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            padding-top: 5rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">حسابداری چاپخانه</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExampleDefault" aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarsExampleDefault">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">داشبورد</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('customers') }}">مشتریان</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('products') }}">محصولات</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('invoices') }}">فاکتورها</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('create_invoice') }}">ایجاد فاکتور</a>
                </li>
                 <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('login') }}">ورود</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
